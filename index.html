<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
</head>

<body>
    <div class="main">
        <!-- Sign up  -->
        <div class="container">
            <!--suggestion switch  -->
            <form action="" method="POST" class="form form-sign-up" id="form-sign-up" autocomplete="off" name="đăng ký">
                <h3 class="heading">Đăng Ký</h3>
                <div class="spacer"></div>

                <div class="form-group">
                    <label for="fullname" class="form-label">Name</label>
                    <input id="fullname" name="fullname" type="text" placeholder="VD: Đào Sỹ Cường"
                        class="form-control">
                    <span class="form-message"></span>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" name="email" type="text" placeholder="VD: cuonga@abc.com" class="form-control"
                        autocomplete="new-email">
                    <span class="form-message"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">PassWord</label>
                    <input id="password" name="password" type="password" placeholder="Nhập mật khẩu"
                        class="form-control">
                    <span class="form-message"></span>
                </div>

                <div class="form-group">
                    <label for="password_confirmation" class="form-label">Confirm Password</label>
                    <input id="password_confirmation" name="password_confirmation" placeholder="Nhập lại mật khẩu"
                        type="password" class="form-control">
                    <span class="form-message"></span>
                </div>

                <button class="form-submit">Đăng ký</button>
            </form>

            <form action="" method="POST" class="form form-sign-in" id="form-sign-in" name="đăng nhập">
                <h3 class="heading">Đăng Nhập</h3>
                <div class="spacer"></div>
                <div class="form-group">
                    <label for="email-sign-in" class="form-label">Email</label>
                    <input id="email-sign-in" name="email" type="text" placeholder="VD: cuonga@abc.com"
                        class="form-control">
                    <span class="form-message"></span>
                </div>
                <div class="form-group">
                    <label for="password-sign-in" class="form-label">PassWord</label>
                    <input id="password-sign-in" name="password" type="password" placeholder="Nhập mật khẩu"
                        class="form-control">
                    <span class="form-message"></span>
                </div>

                <button class="form-submit">Đăng nhập</button>
            </form>
            <!--suggestion switch  -->
            <div class="toggle-container">
                <div class="toggle">
                    <div class="suggestion suggestion-left">
                        <h3 class="suggestion-heading">Chào bạn</h3>
                        <p>Nếu đã có tài khoản, hãy đăng nhập bằng thông tin cá nhân của bạn.</p>
                        <button class="switch_btn switch_btn-login">Đăng nhập</button>
                    </div>
                    <div class="suggestion suggestion-right">
                        <h3 class="suggestion-heading">Chào bạn</h3>
                        <p>Nếu chưa có tài khoản, hãy ký bằng thông tin cá nhân của bạn.</p>
                        <button class="switch_btn switch_btn-signup">Đăng ký</button>
                    </div>
                </div>

            </div>
        </div>

    </div>
    <script src="./main.js"></script>

</body>

</html>
